name: CI/CD Pipeline - Academic RAG System

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Kiểm tra chất lượng mã nguồn & Unit Tests Backend
  # -------------------------------------------------------------
  lint-and-test:
    name: Backend Lint & Pytest
    runs-on: ubuntu-latest

    services:
      # Khởi động Redis service phục vụ test Celery/Queue nếu cần
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
          pip install ruff flake8 pytest pytest-asyncio pytest-cov

      - name: Linting with Flake8
        run: |
          # Dừng build nếu có lỗi syntax hoặc undefined names
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics || true
          # Cảnh báo chuẩn code PEP8
          flake8 backend --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics || true

      - name: Run Unit Tests with Pytest
        env:
          PYTHONPATH: backend
          ENVIRONMENT: testing
          REDIS_URL: redis://localhost:6379/0
          POSTGRES_DB: test_db
        run: |
          pytest backend/tests -v

  # -------------------------------------------------------------
  # Job 2: Kiểm tra tính toàn vẹn khi Build Docker Image
  # -------------------------------------------------------------
  docker-build-check:
    name: Validate Docker Images Build
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Backend Dockerfile
        run: |
          if [ -f docker/Dockerfile.backend ]; then
            docker build -t academic-rag-backend:ci -f docker/Dockerfile.backend .
          elif [ -f backend/Dockerfile ]; then
            docker build -t academic-rag-backend:ci -f backend/Dockerfile .
          else
            echo "Chưa tạo Dockerfile. Sẽ xác thực khi file được tạo ở Giai đoạn 1."
          fi

      - name: Validate Nginx Config
        run: |
          if [ -f docker/nginx/nginx.conf ]; then
            docker run --rm --add-host backend:127.0.0.1 -v ${{ github.workspace }}/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro nginx:alpine nginx -t
          fi
