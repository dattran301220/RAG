services:
  # ----------------------------------------------------------------
  # 1. PostgreSQL: Lưu Metadata & Lịch sử
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: rag_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rag_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_password123}
      POSTGRES_DB: ${POSTGRES_DB:-rag_academic_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rag_admin} -d ${POSTGRES_DB:-rag_academic_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------------------
  # 2. MinIO: Lưu file gốc PDF / DOCX
  # ----------------------------------------------------------------
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: rag_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password123}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Giao diện Web MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - rag_network

  # ----------------------------------------------------------------
  # 3. Qdrant: Vector Database cho RAG
  # ----------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: rag_qdrant
    restart: always
    ports:
      - "6333:6333"   # REST API
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - rag_network

  # ----------------------------------------------------------------
  # 4. Redis: Message Broker cho Hàng Đợi Nền
  # ----------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: rag_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rag_network

  # ----------------------------------------------------------------
  # 5. FastAPI Backend: API Server & Streaming Q&A
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: rag_backend
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - rag_network

  # ----------------------------------------------------------------
  # 6. Celery Worker: Tác Vụ Nền Xử Lý Tài Liệu & Vector Hóa
  # ----------------------------------------------------------------
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: rag_worker
    restart: always
    command: celery -A app.core.celery_app worker --loglevel=info -c 2
    env_file:
      - .env
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
      - postgres
      - qdrant
      - minio
    networks:
      - rag_network

  # ----------------------------------------------------------------
  # 7. Nginx: Load Balancer & Cổng Điều Phối Frontend/Backend
  # ----------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: rag_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  qdrant_data:
  redis_data:
